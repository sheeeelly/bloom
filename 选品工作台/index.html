<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选品智能化工作台 · Merchandising Intelligence</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">MI</div>
          <div class="brand-copy">
            <strong>Merchandising Intelligence</strong>
            <span>选品智能化工作台</span>
          </div>
        </div>

        <nav class="sidenav">
          <button class="sidenav-link is-active" data-route="overview">
            <span class="sidenav-icon" aria-hidden="true">◈</span>
            <span class="sidenav-label">机会总览</span>
          </button>
          <button class="sidenav-link" data-route="pool">
            <span class="sidenav-icon" aria-hidden="true">◎</span>
            <span class="sidenav-label">机会池</span>
          </button>
          <button class="sidenav-link" data-route="new-arrivals">
            <span class="sidenav-icon" aria-hidden="true">↑</span>
            <span class="sidenav-label">竞品上新</span>
          </button>
          <button class="sidenav-link" data-route="gap">
            <span class="sidenav-icon" aria-hidden="true">⇄</span>
            <span class="sidenav-label">AZ vs Gap</span>
          </button>
          <button class="sidenav-link" data-route="risk">
            <span class="sidenav-icon" aria-hidden="true">⚠</span>
            <span class="sidenav-label">避雷榜</span>
          </button>
          <button class="sidenav-link" data-route="draft">
            <span class="sidenav-icon" aria-hidden="true">✎</span>
            <span class="sidenav-label">一键出提案</span>
          </button>
        </nav>

        <footer class="sidebar-footer">
          <div class="sync-status">
            <span class="sync-dot"></span>
            <div class="sync-status__copy">
              <strong>数据已同步</strong>
              <span>2026-W27 · 更新于 2 小时前</span>
            </div>
          </div>
          <div class="sidebar-user">
            <div class="sidebar-user__avatar">S</div>
            <div class="sidebar-user__meta">
              <strong>Shelly</strong>
              <span>品类运营 · BD</span>
            </div>
          </div>
        </footer>
      </aside>

      <div class="main-shell">
        <header class="page-header">
          <div class="page-header__copy">
            <h1 id="page-title">机会总览</h1>
            <p id="page-description">
              三信号汇总后的一页式洞察：本周市场在推什么、内部是否验证、有哪些避雷。
            </p>
          </div>
          <div id="global-filters" class="global-filters"></div>
        </header>

        <main class="workspace">
          <section id="app"></section>
        </main>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
